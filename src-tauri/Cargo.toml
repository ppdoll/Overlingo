[package]
name = "overlingo"
version = "0.2.0"
description = "화면 속 채팅과 자막을 실시간으로 번역하는 데스크톱 앱"
authors = ["ppdoll"]
license = ""
repository = "https://github.com/ppdoll/Overlingo"
edition = "2024"
rust-version = "1.90"

[lib]
name = "overlingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
xcap = "0.9.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tauri-plugin-opener = "2.7.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
